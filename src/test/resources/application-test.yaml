spring:
  application:
    name: invoice-maker-integration-test

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    drop-first: false

  sql:
    init:
      mode: never

logging:
  level:
    org.testcontainers: INFO
    liquibase: INFO