databaseChangeLog:
  - changeSet:
      id: 004-create-company-profiles
      author: ezra
      changes:
        - createTable:
            tableName: company_profiles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_company_profiles
                    nullable: false

              - column:
                  name: company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: website
                  type: VARCHAR(255)

              - column:
                  name: address
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false

              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: vat_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: tin_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: bank_account_name
                  type: VARCHAR(255)

              - column:
                  name: bank_account_number
                  type: VARCHAR(255)

              - column:
                  name: bank_branch
                  type: VARCHAR(255)

              - column:
                  name: bank_swift_code
                  type: VARCHAR(255)

              - column:
                  name: invoice_terms
                  type: VARCHAR(2000)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: company_profiles
            columnNames: organization_id
            constraintName: uk_company_profiles_organization

        - addForeignKeyConstraint:
            baseTableName: company_profiles
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_company_profiles_organization
            onDelete: RESTRICT

  - changeSet:
      id: 005-create-currencies
      author: ezra
      changes:
        - createTable:
            tableName: currencies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_currencies
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: symbol
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: exchange_rate_to_base
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false

              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: default_currency
                  type: BOOLEAN

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: currencies
            columnNames: organization_id, code
            constraintName: uk_currencies_org_code

        - addForeignKeyConstraint:
            baseTableName: currencies
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_currencies_organization
            onDelete: RESTRICT

        - createIndex:
            tableName: currencies
            indexName: idx_currencies_organization
            columns:
              - column:
                  name: organization_id

  - changeSet:
      id: 006-create-customers
      author: ezra
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customers
                    nullable: false

              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: address
                  type: VARCHAR(1000)

              - column:
                  name: city
                  type: VARCHAR(100)

              - column:
                  name: country
                  type: VARCHAR(100)

              - column:
                  name: vat_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: tin_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: customers
            columnNames: organization_id, email
            constraintName: uk_customers_org_email

        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_customers_organization
            onDelete: RESTRICT

        - createIndex:
            tableName: customers
            indexName: idx_customers_organization
            columns:
              - column:
                  name: organization_id

  - changeSet:
      id: 007-create-products
      author: ezra
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false

              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: category
                  type: VARCHAR(100)

              - column:
                  name: stock_quantity
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: products
            columnNames: organization_id, product_name
            constraintName: uk_products_org_name

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_products_organization
            onDelete: RESTRICT

        - createIndex:
            tableName: products
            indexName: idx_products_organization
            columns:
              - column:
                  name: organization_id

  - changeSet:
      id: 008-create-tax-rates
      author: ezra
      changes:
        - createTable:
            tableName: tax_rates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tax_rates
                    nullable: false

              - column:
                  name: tax_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addUniqueConstraint:
            tableName: tax_rates
            columnNames: tax_name
            constraintName: uk_tax_rates_name