databaseChangeLog:
  - changeSet:
      id: 014-secure-users
      author: ezra

      changes:
        - renameColumn:
            tableName: users
            oldColumnName: password
            newColumnName: password_hash
            columnDataType: VARCHAR(255)

        - addColumn:
            tableName: users
            columns:
              - column:
                  name: status
                  type: VARCHAR(30)

              - column:
                  name: email_verified_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: last_login_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: password_changed_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE

        - dropUniqueConstraint:
            tableName: users
            constraintName: uk_users_email

        - sql:
            dbms: postgresql
            sql: |
              UPDATE users
              SET email = LOWER(BTRIM(email)),
                  status = CASE
                      WHEN enabled = TRUE THEN 'ACTIVE'
                      ELSE 'DISABLED'
                  END,
                  email_verified_at = CASE
                      WHEN enabled = TRUE THEN CURRENT_TIMESTAMP
                      ELSE NULL
                  END,
                  password_changed_at = CURRENT_TIMESTAMP;

        - addNotNullConstraint:
            tableName: users
            columnName: status
            columnDataType: VARCHAR(30)

        - addNotNullConstraint:
            tableName: users
            columnName: password_changed_at
            columnDataType: TIMESTAMP WITH TIME ZONE

        - addDefaultValue:
            tableName: users
            columnName: status
            columnDataType: VARCHAR(30)
            defaultValue: PENDING_VERIFICATION

        - addDefaultValue:
            tableName: users
            columnName: password_changed_at
            columnDataType: TIMESTAMP WITH TIME ZONE
            defaultValueComputed: CURRENT_TIMESTAMP

        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uk_users_email_lower
              ON users (LOWER(email));

        - createIndex:
            tableName: users
            indexName: idx_users_status
            columns:
              - column:
                  name: status

        - dropColumn:
            tableName: users
            columnName: enabled

        - dropColumn:
            tableName: users
            columnName: role

  - changeSet:
      id: 015-create-refresh-tokens
      author: ezra

      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: family_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: revoked_reason
                  type: VARCHAR(100)

              - column:
                  name: replaced_by_token_id
                  type: BIGINT

              - column:
                  name: created_ip
                  type: VARCHAR(45)

              - column:
                  name: user_agent
                  type: VARCHAR(512)

        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token_hash
            constraintName: uk_refresh_tokens_token_hash

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: replaced_by_token_id
            referencedTableName: refresh_tokens
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_replacement
            onDelete: SET NULL

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_family
            columns:
              - column:
                  name: family_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at

